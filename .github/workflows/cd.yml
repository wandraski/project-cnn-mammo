name: cd

# CD = release: tag semantica dispara artefato imutavel; ambiente `release`
# exige aprovacao humana antes de publicar.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: construicao do pacote
        run: |
          python -m pip install build
          python -m build
      - name: digest do artefato
        run: |
          python scripts/artifact_digest.py dist/
      - name: artefato imutavel
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
      - name: publicacao (pos-aprovacao)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "release ${{ github.ref_name }}" \
            --notes "Artefato imutavel; ver digest em dist/SHA256SUMS."
