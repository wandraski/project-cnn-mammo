name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalacao (sem dependencias pesadas)
        run: python -m pip install -e .
      - name: testes
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: compilacao
        run: python -m compileall -q src tests
      - name: validacao da configuracao
        run: PYTHONPATH=src python -c "from project_cnn_mammo.config import load_config; print(load_config().common)"
      - name: varredura de segredos
        run: python scripts/check_secrets.py .
      - name: smoke do pipeline
        run: PYTHONPATH=src python -m project_cnn_mammo.cli --config configs/sprints.toml smoke
